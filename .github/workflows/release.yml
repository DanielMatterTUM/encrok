name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  binary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: cp target/x86_64-unknown-linux-musl/release/encrok encrok-x86_64-linux-musl
      - uses: softprops/action-gh-release@v2
        with:
          files: encrok-x86_64-linux-musl
          make_latest: true
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: cp target/x86_64-unknown-linux-musl/release/encrok encrok
      - uses: docker/build-push-action@v6
        with: { context: ., load: true, tags: "encrok:local" }
      - run: docker save encrok:local | gzip > encrok-oci.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: encrok-oci.tar.gz
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/danielmattertum/encrok:latest
            ghcr.io/danielmattertum/encrok:${{ github.ref_name }}
